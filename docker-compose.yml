services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dhaka_tesla_pool}
      POSTGRES_USER: ${POSTGRES_USER:-dtp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dtp_local_password}
    volumes:
      - dtp_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dtp} -d ${POSTGRES_DB:-dhaka_tesla_pool}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  api:
    build:
      context: ./apps/api
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-dtp}:${POSTGRES_PASSWORD:-dtp_local_password}@db:5432/${POSTGRES_DB:-dhaka_tesla_pool}?schema=public
      JWT_SECRET: ${JWT_SECRET:-local-only-change-me-please-1234567890}
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: "lax"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 12
    ports:
      - "${API_PORT:-4000}:4000"

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: /api
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  dtp_postgres:
